dynamodb:
  sample-todo-table:
    AttributeDefinitions:
    - AttributeName: userId
      AttributeType: S
    - AttributeName: todoId
      AttributeType: S
    BillingMode: PAY_PER_REQUEST
    KeySchema:
    - AttributeName: userId
      KeyType: HASH
    - AttributeName: todoId
      KeyType: RANGE
    TableName: sample-todo-table
paths:
  /todos:
    get:
      Properties:
        AuthType: NONE
        CodeUri: src/todos
        Environment:
          Variables:
            BUCKET_NAME: sample-todo-attachments
            TABLE_NAME: sample-todo-table
        EventType: APIGW_V2
        Handler: app.handler
        Runtime: python3.12
    post:
      Properties:
        AuthType: NONE
        CodeUri: src/todos
        Environment:
          Variables:
            BUCKET_NAME: sample-todo-attachments
            TABLE_NAME: sample-todo-table
        EventType: APIGW_V2
        Handler: app.handler
        Runtime: python3.12
  /todos/{todoId}:
    delete:
      Properties:
        AuthType: NONE
        CodeUri: src/todos
        Environment:
          Variables:
            BUCKET_NAME: sample-todo-attachments
            TABLE_NAME: sample-todo-table
        EventType: APIGW_V2
        Handler: app.handler
        Runtime: python3.12
    get:
      Properties:
        AuthType: NONE
        CodeUri: src/todos
        Environment:
          Variables:
            BUCKET_NAME: sample-todo-attachments
            TABLE_NAME: sample-todo-table
        EventType: APIGW_V2
        Handler: app.handler
        Runtime: python3.12
s3:
  sample-todo-attachments:
    BucketName: sample-todo-attachments
