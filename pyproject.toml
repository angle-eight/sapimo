[project]
name = "sapimo"
dynamic = ["version"]
description = "Local mock for applications built with AWS SAM / CDK"
authors = [{ name = "ajinori" }]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["aws", "sam", "cdk", "lambda", "api-gateway", "mock", "local-development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing :: Mocking",
]
dependencies = [
    "httpx>=0.28.1",
    "fastapi[standard]>=0.162.0",
    "pyyaml>=6.0.3",
    "boto3>=1.43.119",
    "moto>=5.2.4",
    "joserfc>=1.7.7",
    "click>=8.5.0",
]

[project.urls]
Homepage = "https://github.com/angle-eight/sapimo"
Repository = "https://github.com/angle-eight/sapimo"
Issues = "https://github.com/angle-eight/sapimo/issues"

[project.scripts]
sapimo = "sapimo.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.8.1",
    "pytest-mock>=3.17.0",
]

[tool.hatch.version]
path = "src/sapimo/__version__.py"

[tool.hatch.build.targets.sdist]
include = ["src/sapimo", "src/sapimo/docker/templates"]

[tool.hatch.build.targets.wheel]
include = ["src/sapimo", "src/sapimo/docker/templates"]

[tool.hatch.build.targets.wheel.sources]
"src/sapimo" = "sapimo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-v -x"
env = [
    "D:TEST_FILE_DIR=AAA",
]
